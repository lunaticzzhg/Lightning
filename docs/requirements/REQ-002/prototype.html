<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Lightning · 历史数据</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #193044; background: #f5f7f8; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #82c8c0; outline-offset: 2px; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 205px minmax(0, 1fr); }
    aside { background: #193345; color: #fff; padding: 27px 13px; }
    .brand { padding: 0 14px 29px; font-size: 21px; font-weight: 750; }
    nav { display: grid; gap: 4px; }
    nav a { border-radius: 8px; color: #bdd0d8; text-decoration: none; padding: 12px 14px; }
    nav a:hover, nav a.active { color: #fff; background: #315263; }
    nav a.active { font-weight: 700; }
    main { width: 100%; max-width: 1120px; margin: 0 auto; padding: 34px 38px 60px; align-self: start; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 23px; }
    .page-head h1 { font-size: 26px; margin: 0 0 6px; }
    .page-head p { margin: 0; font-size: 14px; color: #6b7f8b; line-height: 1.5; }
    .head-actions, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    .btn { min-height: 39px; border: 1px solid #c6d4db; border-radius: 8px; padding: 9px 14px; color: #26495a; background: #fff; white-space: nowrap; }
    .btn:hover { border-color: #49988d; }
    .btn.primary { color: #fff; background: #0b786e; border-color: #0b786e; font-weight: 650; }
    .btn.primary:hover { background: #08665e; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .card { background: #fff; border: 1px solid #dce5e9; border-radius: 11px; padding: 23px; margin-bottom: 16px; box-shadow: 0 2px 8px #17344707; }
    .card h2 { font-size: 17px; margin: 0 0 15px; }
    .muted { color: #6c808a; }
    .small { font-size: 13px; line-height: 1.6; }
    .empty { padding: 42px 18px; text-align: center; }
    .empty h2 { margin: 0 0 8px; }
    .empty p { max-width: 440px; margin: 0 auto 22px; color: #6c808a; line-height: 1.6; }
    .item { background: #fff; border: 1px solid #dce5e9; border-radius: 10px; padding: 20px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .item h2 { font-size: 17px; margin: 0 0 7px; }
    .item p { color: #6c808a; font-size: 13px; line-height: 1.55; margin: 0; }
    .pill { display: inline-block; border-radius: 20px; background: #e6f2ef; color: #1d6c61; padding: 4px 9px; font-size: 12px; font-weight: 500; }
    .pill.warn { color: #935b13; background: #fff2dd; }
    .pill.gray { color: #687e89; background: #edf1f3; }
    .two-col { display: grid; grid-template-columns: minmax(210px, .8fr) minmax(0, 1.5fr); gap: 16px; align-items: start; }
    .stack { display: grid; gap: 9px; }
    .version-option { width: 100%; border: 1px solid #dce5e9; background: #fff; color: #193044; text-align: left; border-radius: 8px; padding: 12px; line-height: 1.5; }
    .version-option.active { border-color: #0b786e; box-shadow: inset 3px 0 #0b786e; }
    .version-option span { display: block; font-size: 12px; color: #70838d; }
    dl { display: grid; grid-template-columns: 104px 1fr; gap: 11px 13px; margin: 0; font-size: 14px; }
    dt { color: #71848e; } dd { margin: 0; overflow-wrap: anywhere; }
    hr { border: 0; border-top: 1px solid #e5ecef; margin: 21px 0; }
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 650; }
    .field label em { color: #ad4538; font-style: normal; }
    .field input, .field select { display: block; width: 100%; min-height: 40px; border: 1px solid #b8c9d2; border-radius: 7px; background: #fff; color: #193044; padding: 9px 11px; }
    .field input[type=file] { padding: 8px; }
    .field input[type=checkbox] { width: auto; min-height: 0; margin: 0 7px 0 0; }
    .field label.checkbox { display: flex; align-items: flex-start; font-weight: 400; line-height: 1.5; }
    .hint { color: #71848e; font-size: 12px; margin: 6px 0 0; }
    .field-error { color: #b04437; font-size: 12px; margin: 6px 0 0; }
    .message { margin-bottom: 18px; padding: 11px 14px; border-radius: 8px; font-size: 13px; line-height: 1.55; }
    .message.success { background: #eaf7ef; color: #246443; border: 1px solid #b9dec6; }
    .message.error { background: #fff0ee; color: #983c30; border: 1px solid #ecc0b8; }
    .message.info { background: #edf5f8; color: #355f73; border: 1px solid #c9dce5; }
    .message.warn { background: #fff7e9; color: #805113; border: 1px solid #ead3a8; }
    .issue { padding: 12px 0; border-bottom: 1px solid #e8edef; font-size: 13px; line-height: 1.55; }
    .issue:last-child { border: 0; }
    .issue strong { display: block; }
    details summary { color: #0b786e; cursor: pointer; font-size: 13px; font-weight: 650; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .back { margin-bottom: 16px; }
    .search-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 14px; }
    .search-grid .field { margin-bottom: 12px; }
    .result-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .result-head h2 { margin-bottom: 5px; }
    .mini-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .mini-table th, .mini-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #e7eef1; vertical-align: top; }
    .mini-table th { color: #657b86; font-weight: 600; background: #f8fafb; }
    .mini-table tr:last-child td { border-bottom: 0; }
    .inline-links { display: flex; gap: 14px; flex-wrap: wrap; }
    .inline-links a { color: #0b786e; font-size: 13px; }
    .wide-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
    .number { font-variant-numeric: tabular-nums; }
    .chart-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 14px; margin-bottom: 15px; }
    .chart-toolbar .field { min-width: 190px; margin: 0; }
    .chart-wrap { border: 1px solid #e0e9ec; border-radius: 9px; background: #fff; }
    .chart-wrap svg { display: block; width: 100%; }
    .chart-point { cursor: pointer; }
    .chart-point:focus-visible { outline: 3px solid #0b786e; outline-offset: -3px; }
    .chart-point.is-active .candle-body { stroke: #193044; stroke-width: 2; }
    .chart-point.is-active .empty-slot { fill: #e7eef1; }
    .chart-readout { min-height: 42px; margin: 7px 0 8px; font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .chart-readout strong { margin-right: 13px; }
    .chart-readout .market-warning { display: block; color: #935b13; }
    .chart-range { margin-top: 14px; }
    .range-track { height: 25px; position: relative; touch-action: none; cursor: pointer; }
    .range-track::before { content: ''; position: absolute; top: 9px; left: 0; right: 0; height: 8px; border-radius: 5px; background: #e3ecef; }
    .range-window { position: absolute; top: 4px; height: 18px; border: 2px solid #0b786e; border-radius: 5px; background: #bfe2dc; cursor: grab; touch-action: none; }
    .range-window:active { cursor: grabbing; }
    .range-handle { position: absolute; top: -4px; width: 12px; height: 22px; border-radius: 4px; background: #0b786e; cursor: ew-resize; touch-action: none; }
    .range-handle.start { left: -6px; }
    .range-handle.end { right: -6px; }
    .range-window:focus-visible, .range-handle:focus-visible { outline: 3px solid #82c8c0; outline-offset: 3px; }
    .range-dates { display: flex; justify-content: space-between; color: #6c808a; font-size: 12px; }
    .status-line { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 14px 0; font-size: 13px; }
    .status-line span { white-space: nowrap; }
    .status-line .warn { color: #935b13; font-weight: 650; }
    .status-line.warn { color: #935b13; font-weight: 650; }
    .result-meta { margin: 4px 0 0; color: #6c808a; font-size: 13px; }
    .coverage-note { margin: 13px 0 0; font-size: 14px; }
    .anomaly-note { margin: 8px 0 0; color: #935b13; font-size: 13px; font-weight: 650; }
    .table-scroll { max-height: 360px; overflow: auto; }
    .detail-section h3 { font-size: 14px; margin: 17px 0 8px; }
    .chart-legend { margin: 8px 0 0; font-size: 12px; color: #647b86; }
    .chart-legend b { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 12px; border-radius: 2px; }
    .chart-legend b:first-child { margin-left: 0; }
    .detail-section { margin-top: 13px; border-top: 1px solid #e5ecef; padding-top: 13px; }
    .detail-section summary { font-size: 14px; }
    .detail-section .mini-table { margin-top: 12px; }
    .changed-value { color: #9d4b11; font-weight: 700; }
    .source-name { font-weight: 650; color: #193044; }
    .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin: 0 0 22px; }
    .summary-grid div { min-width: 0; }
    .summary-grid dt { color: #71848e; font-size: 12px; }
    .summary-grid dd { margin: 3px 0 0; font-size: 14px; overflow-wrap: anywhere; }
    @media (max-width: 960px) { .search-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 800px) { .app { grid-template-columns: 1fr; align-content: start; } aside { padding: 10px 16px; } .brand { padding: 5px 3px 12px; } nav { display: flex; overflow-x: auto; } nav a { white-space: nowrap; } main { padding: 24px 18px 50px; } .two-col, .form-grid, .summary-grid { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .page-head, .item { flex-direction: column; align-items: stretch; } .search-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">Lightning</div>
      <nav aria-label="主导航">
        <a href="../REQ-001/prototype.html">策略</a>
        <a class="active" href="./prototype.html" aria-current="page">历史数据</a>
      </nav>
    </aside>
    <main id="main" aria-live="polite"></main>
  </div>
  <script>
    // 只演示页面交互。示例数据和上传结果保存在当前浏览器页面内。
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const qs = new URLSearchParams(location.search);
    const rangeDemo = qs.get('demo') === 'range';
    const demoDays = rangeDemo
      ? Array.from({ length: 115 }, (_, i) => { const d = new Date('2026-07-01T12:00:00Z'); d.setUTCDate(d.getUTCDate() + i); return d.toISOString().slice(0, 10); }).filter(day => ![0, 6].includes(new Date(`${day}T12:00:00Z`).getUTCDay()) && (day < '2026-10-01' || day > '2026-10-07'))
      : ['2026-10-20', '2026-10-21', '2026-10-22', '2026-10-23'];
    const bar = (symbol, exchange, time, values, batch) => ({ symbol, exchange, time, values, batch });
    const batches = {
      B001: { file: 'a_daily_20_21.csv', imported: '2026-10-21 18:00', checksum: 'a4168c21' },
      B002: { file: 'a_daily_23.csv', imported: '2026-10-23 18:00', checksum: 'f22017ab' },
      B003: { file: 'a_minute_20.csv', imported: '2026-10-20 17:00', checksum: '6c21b782' },
      B004: { file: 'a_minute_add.csv', imported: '2026-10-22 10:20', checksum: '8f34c912' },
      B005: { file: 'us_daily.csv', imported: '2026-10-22 18:00', checksum: 'c1e904ad' }
    };
    const aDaily1 = [
      bar('600519', 'SH', '2026-10-20', [1680, 1690, 1670, 1682, 320000], 'B001'),
      bar('600519', 'SH', '2026-10-21', [1682, 1692, 1678, 1688, 290000], 'B001'),
      bar('000001', 'SZ', '2026-10-20', [11, 11.3, 10.9, 11.2, 620000], 'B001')
    ];
    const aMinute1 = [
      bar('600519', 'SH', '2026-10-20 09:31', [1680, 1682, 1679, 1681, 3200], 'B003'),
      bar('600519', 'SH', '2026-10-20 09:32', [1681, 1683, 1680, 1682, 2800], 'B003')
    ];
    const seed = [
      { id: 'D001', sourceId: 'S001', source: '示例提供方 A／股票日线', market: 'A 股', interval: '日线', price: '未复权', session: '常规时段', versions: [
        { id: 'V001', created: '2026-10-21 18:00', basedOn: '首次导入', rows: aDaily1, issues: [] },
        { id: 'V002', created: '2026-10-23 18:00', basedOn: 'V001', rows: [...aDaily1, bar('600519', 'SH', '2026-10-23', [1690, 1720, 1684, 1712, 510000], 'B002')], issues: [{ symbol: '600519', time: '2026-10-23', text: '成交量由 29 万股升至 51 万股' }] }
      ] },
      { id: 'D002', sourceId: 'S002', source: '示例提供方 A／股票分钟行情', market: 'A 股', interval: '1 分钟线', price: '未复权', session: '常规时段', versions: [
        { id: 'V001', created: '2026-10-20 17:00', basedOn: '首次导入', rows: aMinute1, issues: [] },
        { id: 'V002', created: '2026-10-22 10:20', basedOn: 'V001', rows: [...aMinute1, bar('600519', 'SH', '2026-10-20 09:34', [1682, 1684, 1680, 1683, 3100], 'B004')], issues: [] }
      ] },
      { id: 'D003', sourceId: 'S003', source: '示例提供方 B／美股日线', market: '美股', interval: '日线', price: '未复权', session: '常规时段', versions: [
        { id: 'V001', created: '2026-10-22 18:00', basedOn: '首次导入', rows: [bar('AAPL', 'NASDAQ', '2026-10-20', [250, 254, 248, 252, 1800000], 'B005')], issues: [] }
      ] }
    ];
    if (rangeDemo) {
      batches.B006 = { file: 'range_demo.csv', imported: '2026-10-23 18:00', checksum: 'demo' };
      const existing = new Set(seed[0].versions[1].rows.map(r => r.time));
      seed[0].versions[1].rows.push(...demoDays.filter(day => !existing.has(day)).map((day, i) => {
        const open = 1600 + i * 1.15 + Math.sin(i / 5) * 18;
        return bar('600519', 'SH', day, [open, open + 12, open - 9, open + Math.sin(i) * 7, 220000 + i * 1100].map((value, index) => index < 4 ? Number(value.toFixed(2)) : value), 'B006');
      }));
    }
    const initialFilters = { market: 'A 股', interval: '日线', symbol: '600519', from: rangeDemo ? demoDays[0] : '2026-10-20', to: '2026-10-23' };
    const state = { datasets: qs.has('empty') ? [] : seed, page: 'list', filters: initialFilters, searchDirty: false, selectedId: 'D001', selectedVersion: 'V002', chartDay: null, chartWindow: null, chartSelection: null, chartHover: null, chartContext: null, chartSegment: null, reviewPage: 0, uploadTarget: null, pending: null, result: null, message: null };
    let rangeDrag = null;
    const resetChartView = () => { state.chartWindow = null; state.chartSelection = null; state.chartHover = null; };
    const main = document.getElementById('main');
    const selectedDataset = () => state.datasets.find(d => d.id === state.selectedId);
    const latest = d => d.versions.at(-1);
    const selectedVersion = () => selectedDataset()?.versions.find(v => v.id === state.selectedVersion);
    const identity = d => [d.sourceId, d.market, d.interval, d.price, d.adjustmentMethod || '', d.adjustmentBase || '', d.session].join('|');
    const button = (label, action, id = '', primary = false) => `<button type="button" class="btn${primary ? ' primary' : ''}" data-action="${action}" data-id="${esc(id)}">${esc(label)}</button>`;
    const head = (title, subtitle = '', actions = '') => `<div class="page-head"><div><h1>${esc(title)}</h1>${(Array.isArray(subtitle) ? subtitle : [subtitle]).filter(Boolean).map(line => `<p>${esc(line)}</p>`).join('')}</div><div class="head-actions">${actions}</div></div>`;
    const priceLabel = d => d.price === '未复权' ? '未按分红、拆股调整' : `${d.price}价格`;
    const providerName = d => d.source.split('／')[0];
    const sourceDisplay = d => state.datasets.filter(x => x.market === d.market && x.interval === d.interval && providerName(x) === providerName(d)).length > 1 ? d.source : providerName(d);
    const symbolMarket = symbol => /^\d{6}$/.test(symbol) ? 'A 股' : /^[A-Z.]{1,8}$/.test(symbol) ? '美股' : '';
    const isWeekend = day => [0, 6].includes(new Date(`${day}T12:00:00Z`).getUTCDay());
    const savedSpan = rows => { const times = rows.map(r => r.time).sort(); return times.length ? `${times[0]}${times.length > 1 ? ` ～ ${times.at(-1)}` : ''}` : ''; };
    const keyOf = r => `${r.symbol}|${r.exchange}|${r.time}`;
    const inRange = (time, f) => time.slice(0, 10) >= f.from && time.slice(0, 10) <= f.to && (!f.segment || f.interval === '日线' || (time.slice(11) >= f.minuteFrom && time.slice(11) <= f.minuteTo));
    const matchingRows = (v, f) => v.rows.filter(r => r.symbol.toUpperCase() === f.symbol.toUpperCase() && inRange(r.time, f));
    const inferExchange = (symbol, market) => market === 'A 股' ? (/^6/.test(symbol) ? 'SH' : /^[03]/.test(symbol) ? 'SZ' : /^[48]/.test(symbol) ? 'BJ' : '') : '';
    function slotsFor(f) {
      const days = demoDays.filter(day => day >= f.from && day <= f.to);
      if (!days.length || f.from < demoDays[0] || f.to > demoDays.at(-1) || f.market !== 'A 股') return [];
      if (f.interval === '日线') return days;
      if (!f.segment) return [];
      const [sh, sm] = f.minuteFrom.split(':').map(Number), [eh, em] = f.minuteTo.split(':').map(Number);
      const start = sh * 60 + sm, end = eh * 60 + em;
      if (end < start) return [];
      const inSession = minute => f.market === 'A 股'
        ? (minute >= 9 * 60 + 30 && minute < 11 * 60 + 30) || (minute >= 13 * 60 && minute < 15 * 60)
        : minute >= 9 * 60 + 30 && minute < 16 * 60;
      const minutes = Array.from({ length: end - start + 1 }, (_, n) => start + n).filter(inSession);
      return days.flatMap(day => minutes.map(minute => `${day} ${String(Math.floor(minute / 60)).padStart(2, '0')}:${String(minute % 60).padStart(2, '0')}`));
    }
    function coverage(v, f) {
      const rows = matchingRows(v, f), found = new Set(rows.map(r => r.time));
      let slots = slotsFor(f);
      if (f.segment && rows.length) {
        const times = rows.map(r => r.time).sort();
        slots = slots.filter(s => s >= times[0] && s <= times.at(-1));
      }
      if (f.segment && !rows.length) slots = [];
      const covered = slots.filter(s => found.has(s));
      return { rows, slots, covered, missing: slots.filter(s => !found.has(s)), unknown: !slots.length };
    }
    function chartDays(v, f) {
      return [...new Set([...demoDays.filter(day => day >= f.from && day <= f.to), ...matchingRows(v, f).map(r => r.time.slice(0, 10))])].sort();
    }
    function candleChart(c, f, issues) {
      const slots = c.unknown ? c.rows.map(r => r.time).sort() : c.slots;
      if (!slots.length) return '<div class="message info">所选范围没有保存的行情。可换个日期或导入文件。</div>';
      const width = Math.max(320, Math.min(980, main.clientWidth - (window.innerWidth > 800 ? 124 : 84)));
      const maxVisible = Math.max(12, Math.min(60, Math.floor((width - 90) / 12)));
      const minVisible = Math.min(8, slots.length);
      if (!state.chartWindow) state.chartWindow = { start: Math.max(0, slots.length - maxVisible), count: Math.min(slots.length, maxVisible) };
      state.chartWindow.count = Math.min(slots.length, Math.max(minVisible, Math.min(maxVisible, state.chartWindow.count)));
      state.chartWindow.start = Math.max(0, Math.min(slots.length - state.chartWindow.count, state.chartWindow.start));
      const { start, count } = state.chartWindow;
      const visible = slots.slice(start, start + count);
      const rows = new Map(c.rows.map(r => [r.time, r]));
      const chartRows = visible.map(s => rows.get(s)).filter(Boolean);
      const prices = chartRows.flatMap(r => r.values.slice(0, 4));
      const low = Math.min(...prices), high = Math.max(...prices);
      const pad = Math.max((high - low) * .12, high * .004, 1);
      const min = Number.isFinite(low) ? low - pad : 0, max = Number.isFinite(high) ? high + pad : 1;
      const maxVolume = Math.max(1, ...chartRows.map(r => r.values[4]));
      const left = 58, right = width - 22, step = (right - left) / visible.length;
      const priceY = n => 32 + (max - n) / (max - min) * 195;
      const volumeY = n => 310 - n / maxVolume * 60;
      const up = f.market === 'A 股' ? '#cf5546' : '#188b68', down = f.market === 'A 股' ? '#188b68' : '#cf5546';
      if (!visible.includes(state.chartSelection)) state.chartSelection = null;
      const defaultSlot = [...visible].reverse().find(s => rows.has(s)) || visible.at(-1);
      state.chartContext = { visible, rows, issues, defaultSlot, slots, maxVisible, minVisible };
      const marks = visible.map((slot, index) => {
        const x = left + step * (index + .5), r = rows.get(slot);
        const label = f.interval === '日线' ? slot.slice(5) : slot.slice(11);
        const showLabel = visible.length <= 12 || index % Math.ceil(visible.length / 10) === 0 || index === visible.length - 1;
        const issue = issues.some(i => i.time === slot);
        const axis = showLabel ? `<text x="${x}" y="338" text-anchor="middle" fill="#6c808a" font-size="11">${esc(label)}</text>` : '';

        count = end - start;
      } else if (handle) count = Math.max(minVisible, Math.min(Math.min(slots.length - start, maxVisible), count + direction));
      else start = Math.max(0, Math.min(slots.length - count, start + direction));
      state.chartWindow = { start, count }; state.chartHover = null; render();
      document.querySelector(handle ? `.range-handle.${handle.classList.contains('start') ? 'start' : 'end'}` : '.range-window')?.focus();
    });
    window.addEventListener('resize', () => { if (state.page === 'detail') render(); });
    render();
  </script>
</body>
</html>
