<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Lightning · 策略管理</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #193044; background: #f5f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #82c8c0; outline-offset: 2px; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 205px minmax(0, 1fr); }
    aside { background: #193345; color: #fff; padding: 27px 13px; }
    .brand { padding: 0 14px 29px; font-size: 21px; font-weight: 750; }
    nav { display: grid; gap: 4px; }
    nav button { width: 100%; border: 0; border-radius: 8px; background: transparent; color: #bdd0d8; text-align: left; padding: 12px 14px; }
    nav button:hover, nav button.active { color: #fff; background: #315263; }
    nav button.active { font-weight: 700; }
    main { width: 100%; max-width: 1120px; margin: 0 auto; padding: 34px 38px 60px; align-self: start; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 23px; }
    .page-head h1 { font-size: 26px; margin: 0 0 6px; }
    .page-head p { margin: 0; font-size: 14px; color: #6b7f8b; line-height: 1.5; }
    .head-actions, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    .btn { min-height: 39px; border: 1px solid #c6d4db; border-radius: 8px; padding: 9px 14px; color: #26495a; background: #fff; white-space: nowrap; }
    .btn:hover { border-color: #49988d; }
    .btn.primary { color: #fff; background: #0b786e; border-color: #0b786e; font-weight: 650; }
    .btn.primary:hover { background: #08665e; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .card { background: #fff; border: 1px solid #dce5e9; border-radius: 11px; padding: 23px; margin-bottom: 16px; box-shadow: 0 2px 8px #17344707; }
    .card h2 { font-size: 17px; margin: 0 0 15px; }
    .muted { color: #6c808a; }
    .small { font-size: 13px; line-height: 1.6; }
    .empty { padding: 65px 18px; text-align: center; }
    .empty h2 { margin: 0 0 8px; }
    .empty p { max-width: 420px; margin: 0 auto 22px; color: #6c808a; line-height: 1.6; }
    .item { background: #fff; border: 1px solid #dce5e9; border-radius: 10px; padding: 20px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .item h2 { font-size: 17px; margin: 0 0 7px; }
    .item p { color: #6c808a; font-size: 13px; line-height: 1.55; margin: 0; }
    .pill { display: inline-block; border-radius: 20px; background: #e6f2ef; color: #1d6c61; padding: 4px 9px; font-size: 12px; font-weight: 500; }
    .pill.gray { color: #687e89; background: #edf1f3; }
    .two-col { display: grid; grid-template-columns: minmax(210px, .8fr) minmax(0, 1.5fr); gap: 16px; align-items: start; }
    .stack { display: grid; gap: 9px; }
    .version-option { width: 100%; border: 1px solid #dce5e9; background: #fff; color: #193044; text-align: left; border-radius: 8px; padding: 12px; line-height: 1.5; }
    .version-option.active { border-color: #0b786e; box-shadow: inset 3px 0 #0b786e; }
    .version-option span { display: block; font-size: 12px; color: #70838d; }
    dl { display: grid; grid-template-columns: 105px 1fr; gap: 11px 13px; margin: 0; font-size: 14px; }
    dt { color: #71848e; } dd { margin: 0; overflow-wrap: anywhere; }
    hr { border: 0; border-top: 1px solid #e5ecef; margin: 21px 0; }
    .field { margin-bottom: 19px; }
    .field label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 650; }
    .field label em { color: #ad4538; font-style: normal; }
    .field input, .field select { display: block; width: 100%; min-height: 40px; border: 1px solid #b8c9d2; border-radius: 7px; background: #fff; color: #193044; padding: 9px 11px; }
    .field input[type=file] { padding: 8px; }
    .field select:disabled { background: #f3f6f7; color: #617783; }
    .hint { color: #71848e; font-size: 12px; margin: 6px 0 0; }
    .field-error { color: #b04437; font-size: 12px; margin: 6px 0 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .param { border-bottom: 1px solid #e8edef; padding: 10px 0; }
    .param:last-child { border-bottom: 0; }
    .param strong { font-size: 13px; }
    .param span { display: block; margin-top: 3px; color: #6c808a; font-size: 12px; }
    .message { margin-bottom: 18px; padding: 11px 14px; border-radius: 8px; font-size: 13px; line-height: 1.55; }
    .message.success { background: #eaf7ef; color: #246443; border: 1px solid #b9dec6; }
    .message.error { background: #fff0ee; color: #983c30; border: 1px solid #ecc0b8; }
    .message.info { background: #edf5f8; color: #355f73; border: 1px solid #c9dce5; }
    @media (max-width: 800px) { .app { grid-template-columns: 1fr; align-content: start; } aside { padding: 10px 16px; } .brand { padding: 5px 3px 12px; } nav { display: flex; overflow-x: auto; } nav button { white-space: nowrap; } main { padding: 24px 18px 50px; } .two-col { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .page-head, .item { flex-direction: column; align-items: stretch; } .head-actions { justify-content: flex-start; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">Lightning</div>
      <nav aria-label="主导航">
        <button type="button" data-nav="strategies">策略</button>
      </nav>
    </aside>
    <main id="main" aria-live="polite"></main>
  </div>
  <script>
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stamp = () => new Date().toLocaleString('zh-CN', { hour12: false });
    const query = new URLSearchParams(location.search);
    const state = {
      strategies: query.has('empty') ? [] : [
        { id: 'S001', name: '分钟突破策略', description: '根据分钟行情识别突破信号' },
        { id: 'S002', name: '双均线策略', description: '根据两条均线的变化调整目标持仓' }
      ],
      versions: query.has('empty') ? [] : [
        { id: 'V001', strategyId: 'S001', file: 'minute_breakout_v1.zip', time: '2026-10-20 14:10', checksum: 'a8f231c0', parameters: [
          { label: '窗口长度', type: '整数', rule: '必填 · 1～120 · 默认 10' },
          { label: '突破阈值', type: '小数', rule: '必填 · 0～1 · 默认 0.4' }
        ] },
        { id: 'V002', strategyId: 'S001', file: 'minute_breakout_v2.zip', time: '2026-10-22 10:20', checksum: 'b7e419d2', parameters: [
          { label: '窗口长度', type: '整数', rule: '必填 · 1～120 · 默认 20' },
          { label: '突破阈值', type: '小数', rule: '必填 · 0～1 · 默认 0.5' },
          { label: '启用过滤', type: '布尔值', rule: '默认是' }
        ] },
        { id: 'V003', strategyId: 'S002', file: 'dual_ma_v1.zip', time: '2026-10-22 15:30', checksum: 'c1e904ad', parameters: [
          { label: '短均线周期', type: '整数', rule: '必填 · 2～60 · 默认 5' },
          { label: '长均线周期', type: '整数', rule: '必填 · 10～240 · 默认 30' },
          { label: '交易市场', type: '枚举', rule: 'A 股 / 美股 · 默认 A 股' }
        ] }
      ],
      page: query.get('page') || 'strategies',
      selectedStrategyId: 'S001',
      selectedVersionId: 'V002',
      message: null
    };
    const main = document.getElementById('main');
    const strategy = () => state.strategies.find(item => item.id === state.selectedStrategyId);
    const version = () => state.versions.find(item => item.id === state.selectedVersionId);
    const versionsFor = id => state.versions.filter(item => item.strategyId === id);
    const button = (label, action, id = '', primary = false) => `<button type="button" class="btn${primary ? ' primary' : ''}" data-action="${action}" data-id="${esc(id)}">${label}</button>`;
    function head(title, subtitle = '', actions = '') {
      return `<div class="page-head"><div><h1>${esc(title)}</h1>${subtitle ? `<p>${esc(subtitle)}</p>` : ''}</div><div class="head-actions">${actions}</div></div>`;
    }
    function strategiesPage() {
      const actions = button('上传新策略', 'upload-new', '', true);
      if (!state.strategies.length) return head('策略', '管理策略及其代码版本', actions) +
        `<section class="card empty"><h2>还没有策略</h2><p>上传 Python 策略包，创建第一个策略和代码版本。</p>${actions}</section>`;
      const rows = state.strategies.map(item => {
        const related = versionsFor(item.id);
        const latest = related.at(-1);
        return `<article class="item"><div><h2>${esc(item.name)}</h2><p>${esc(item.description)}</p><p>${related.length} 个代码版本 · 最新 ${esc(latest.id)} · ${esc(latest.time)}</p></div>${button('查看策略', 'open-strategy', item.id)}</article>`;
      }).join('');
      return head('策略', `${state.strategies.length} 个策略`, actions) + rows;
    }
    function versionPage() {
      const selected = version();
      const owner = strategy();
      if (!selected || !owner) return strategiesPage();
      const choices = [...versionsFor(owner.id)].reverse().map(item => `<button class="version-option ${item.id === selected.id ? 'active' : ''}" data-action="view-version" data-id="${esc(item.id)}" aria-current="${item.id === selected.id ? 'true' : 'false'}"><strong>${esc(item.id)}</strong><span>${esc(item.time)}</span></button>`).join('');
      const params = selected.parameters.length
        ? selected.parameters.map(item => `<div class="param"><strong>${esc(item.label)}</strong><span>${esc(item.type)} · ${esc(item.rule)}</span></div>`).join('')
        : '<p class="muted small">该版本没有可调整参数。</p>';
      return head(owner.name, owner.description, button('返回策略列表', 'strategies') + button('上传新版本', 'upload-version', '', true)) +
        `<div class="two-col"><section class="card"><h2>代码版本</h2><div class="stack">${choices}</div></section><section class="card"><div class="row"><h2>${esc(selected.id)}</h2><span class="pill gray">已导入，未运行验证</span></div><dl><dt>所属策略</dt><dd>${esc(owner.name)} · ${esc(owner.id)}</dd><dt>上传时间</dt><dd>${esc(selected.time)}</dd><dt>原始代码包</dt><dd>${esc(selected.file)}</dd><dt>文件校验值</dt><dd>${esc(selected.checksum)}</dd></dl><hr><h2>参数定义</h2>${params}<hr>${button('下载原始包', 'download-package', selected.id)}</section></div>`;
    }
    function uploadPage(mode) {
      const existing = mode === 'version';
      const owner = strategy();
      return head(existing ? '上传新代码版本' : '上传新策略',
        existing ? `归属：${owner.name} · ${owner.id}` : '上传后创建策略及首个代码版本',
        button(existing ? '返回策略详情' : '返回策略列表', existing ? 'version-page' : 'strategies')) +
        `<section class="card" style="max-width:700px"><form id="upload-form"><div class="field"><label for="package-file">Python 策略包（ZIP） <em>*</em></label><input id="package-file" name="package" type="file" accept=".zip,application/zip"><p class="hint">策略名称及参数定义从包内读取；文件名不决定归属。</p><p class="field-error" id="package-error"></p></div><div class="actions"><button class="btn primary" type="submit">上传并校验</button></div></form></section>`;
    }
    function render() {
      document.querySelectorAll('[data-nav]').forEach(nav => { nav.classList.add('active'); nav.setAttribute('aria-current', 'page'); });
      const views = {
        strategies: strategiesPage,
        version: versionPage,
        'upload-new': () => uploadPage('new'),
        'upload-version': () => uploadPage('version')
      };
      state.page = views[state.page] ? state.page : 'strategies';
      main.innerHTML = (state.message ? `<div class="message ${state.message.type}" role="status">${esc(state.message.text)}</div>` : '') + views[state.page]();
      const form = document.getElementById('upload-form');
      if (form) form.addEventListener('submit', uploadPackage);
    }
    function go(page) { state.page = page; state.message = null; render(); window.scrollTo(0, 0); }
    async function uploadPackage(event) {
      event.preventDefault();
      const file = event.currentTarget.elements.package.files[0];
      const error = document.getElementById('package-error');
      if (!file || !file.size || !file.name.toLowerCase().endsWith('.zip')) {
        error.textContent = '请选择有效的 ZIP 策略包。';
        return;
      }
      const digest = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
      const checksum = [...new Uint8Array(digest)].map(n => n.toString(16).padStart(2, '0')).join('');
      const owner = strategy();
      const duplicate = state.versions.find(item => item.strategyId === owner?.id && item.checksum === checksum);
      if (duplicate) {
        state.selectedVersionId = duplicate.id;
        state.page = 'version';
        state.message = { type: 'info', text: '相同代码包已上传，已打开已有版本。' };
        return render();
      }
      // 交互原型只模拟上传反馈；实际产品从 ZIP 清单读取名称和参数定义。
      if (state.page === 'upload-new') {
        const id = 'S' + String(state.strategies.length + 1).padStart(3, '0');
        state.strategies.push({ id, name: '新上传策略', description: '从策略包读取的说明' });
        state.selectedStrategyId = id;
      }
      const id = 'V' + String(state.versions.length + 1).padStart(3, '0');
      state.versions.push({ id, strategyId: state.selectedStrategyId, file: file.name, time: stamp(), checksum, parameters: [] });
      state.selectedVersionId = id;
      state.page = 'version';
      state.message = { type: 'success', text: '已导入，未运行验证。' };
      render();
    }
    document.querySelectorAll('[data-nav]').forEach(nav => nav.addEventListener('click', () => go('strategies')));
    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'strategies') go('strategies');
      else if (action === 'upload-new') go('upload-new');
      else if (action === 'upload-version') go('upload-version');
      else if (action === 'version-page') go('version');
      else if (action === 'open-strategy') {
        state.selectedStrategyId = target.dataset.id;
        state.selectedVersionId = versionsFor(state.selectedStrategyId).at(-1)?.id;
        go('version');
      } else if (action === 'view-version') {
        state.selectedVersionId = target.dataset.id;
        go('version');
      } else if (action === 'download-package') {
        state.message = { type: 'info', text: '原始代码包下载入口。' };
        render();
      }
    });
    render();
  </script>
</body>
</html>
